# định nghĩa ứng dụng Argo CD tự động đồng bộ từ nhánh gitops vào cụm Kubernetes
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecoalert
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PhamNguyen0902/EcoAlert.git
    targetRevision: gitops
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
