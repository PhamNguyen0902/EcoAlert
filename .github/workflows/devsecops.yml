name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: phamnguyen0902/ecoalert

jobs:
  # ===============================================================
  # 1. tích hợp liên tục tự động biên dịch kiểm tra sức khỏe kiểm thử và độ bao phủ mã nguồn
  # ===============================================================
  ci-build-and-test:
    name: 1. CI Automation (Build, Health Check & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenCV System Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Cache pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-vision-${{ hashFiles('backend/vision-service/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-vision-

      - name: Install All Dependencies
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix mobile ci --no-audit --no-fund
          (cd backend/shared && npm ci --no-audit --no-fund && npm run build)
          for svc in api-gateway user-service alert-service gis-service media-service notification-service ai-service; do
            echo "Installing dependencies for backend/$svc..."
            (cd "backend/$svc" && npm install --no-audit --no-fund)
          done
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
          pip install -r backend/vision-service/requirements-dev.txt coverage

      - name: 1.1. Code Linting & Syntax Check
        run: |
          npm --prefix frontend run lint
          python -m compileall -q backend/vision-service/main.py backend/vision-service/routers backend/vision-service/schemas backend/vision-service/services

      - name: 1.2. Build All Projects (Backend Microservices & Frontend)
        run: |
          for svc in api-gateway user-service alert-service gis-service media-service notification-service ai-service; do
            echo "Building backend/$svc..."
            (cd "backend/$svc" && npm run build && node --check dist/server.js)
          done
          npm --prefix frontend run build

      - name: 1.3. Unit Testing & Code Coverage
        run: |
          mkdir -p coverage
          echo "=== Frontend Tests ==="
          (
            cd frontend
            npm run test:routing
            node --test --experimental-test-coverage \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=lcov --test-reporter-destination=../coverage/frontend-cjs.lcov \
              tests/*.test.cjs
          )

          for svc in ai-service alert-service gis-service media-service; do
            echo "=== Backend Tests: $svc ==="
            (
              cd "backend/$svc"
              node --test --experimental-test-coverage \
                --test-reporter=spec --test-reporter-destination=stdout \
                --test-reporter=lcov --test-reporter-destination="../../coverage/${svc}.lcov" \
                dist/tests/*.test.js
            )
          done

          echo "=== Backend Tests: notification-service ==="
          (
            cd backend/notification-service
            node --test --experimental-test-coverage \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=lcov --test-reporter-destination="../../coverage/notification-service.lcov" \
              tests/*.test.cjs
          )

          echo "=== Python Vision Service Tests ==="
          (
            cd backend/vision-service
            python -m coverage run --source=routers,schemas,services -m unittest discover -s tests -v
            python -m coverage report -m
            python -m coverage xml -o ../../coverage/vision-coverage.xml
          )

          echo "=== Mobile Contract & Unit Tests ==="
          (cd mobile && npm test)

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 7

  # ===============================================================
  # 2. kiểm tra bảo mật liên tục phân tích mã tĩnh thư viện phụ thuộc khóa bí mật và cổng bảo mật
  # ===============================================================
  continuous-security:
    name: 2. Continuous Security (Gitleaks, Audit, Trivy & Sonar)
    needs: ci-build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Test Coverage Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: code-coverage-report
          path: coverage/

      # --- 2.1 phát hiện rò rỉ khóa bí mật bằng gitleaks ---
      - name: 2.1. Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # --- 2.2 kiểm toán lỗ hổng thư viện phụ thuộc ---
      - name: 2.2. Dependency Vulnerability Audit
        run: |
          for dir in frontend mobile backend/shared backend/api-gateway backend/user-service backend/alert-service backend/gis-service backend/media-service backend/notification-service backend/ai-service; do
            echo "Scanning dependencies in $dir..."
            (cd "$dir" && npm audit --audit-level=high) || echo "::warning::npm audit detected vulnerabilities in $dir. Review security report."
          done

      # --- 2.3 quét hệ thống tệp tin và thư viện phụ thuộc bằng trivy ---
      - name: 2.3. Trivy Filesystem & Dependency Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-fs-report.txt'
          severity: 'CRITICAL,HIGH'

      - name: Display Trivy FS Scan Results
        run: |
          if [ -f trivy-fs-report.txt ]; then
            cat trivy-fs-report.txt
          fi

      # --- 2.4 phân tích chất lượng mã nguồn bằng sonarqube và sonarcloud ---
      - name: 2.4. SonarQube Code Quality Analysis
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

      # --- 2.5 cổng bảo mật lưu báo cáo bảo mật ---
      - name: 2.5. Upload Security Reports (Nexus / Artifact Stand-in)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-reports
          path: trivy-fs-report.txt
          retention-days: 7

  # ===============================================================
  # 3. quản lý gói thành phẩm đóng gói docker quét ảnh container và đẩy lên kho lưu trữ
  #    - Pull request: chỉ build + quét, KHÔNG đăng nhập / đẩy image lên GHCR
  #    - Push vào main / manual: build + quét + đẩy lên GHCR
  # ===============================================================
  docker-build-and-publish:
    name: 3. Artifact Management (Docker & GHCR)
    needs: continuous-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Short SHA
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 1) Frontend Nginx ---
      - name: Docker Build (Local for Scanning) - frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=min,scope=frontend

      - name: Run Trivy Image Scan - frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          format: 'table'
          output: 'trivy-image-frontend.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Display Trivy Image Report & Cleanup - frontend
        run: |
          if [ -f trivy-image-frontend.txt ]; then cat trivy-image-frontend.txt; fi
          docker rmi "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}" || true

      - name: Push Docker Image to GHCR - frontend
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend

      # --- 2) API Gateway (Node.js) ---
      - name: Docker Build (Local for Scanning) - api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: SERVICE_NAME=api-gateway
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }}
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,mode=min,scope=api-gateway

      - name: Run Trivy Image Scan - api-gateway
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }}
          format: 'table'
          output: 'trivy-image-api-gateway.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Display Trivy Image Report & Cleanup - api-gateway
        run: |
          if [ -f trivy-image-api-gateway.txt ]; then cat trivy-image-api-gateway.txt; fi
          docker rmi "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }}" || true

      - name: Push Docker Image to GHCR - api-gateway
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: SERVICE_NAME=api-gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }}
          cache-from: type=gha,scope=api-gateway

      # --- 3) Vision Service (Python FastAPI) ---
      - name: Docker Build (Local for Scanning) - vision-service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/vision-service
          file: ./backend/vision-service/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/vision-service:${{ github.sha }}
          cache-from: type=gha,scope=vision-service
          cache-to: type=gha,mode=min,scope=vision-service

      - name: Run Trivy Image Scan - vision-service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/vision-service:${{ github.sha }}
          format: 'table'
          output: 'trivy-image-vision-service.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Display Trivy Image Report & Cleanup - vision-service
        run: |
          if [ -f trivy-image-vision-service.txt ]; then cat trivy-image-vision-service.txt; fi
          docker rmi "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/vision-service:${{ github.sha }}" || true

      - name: Push Docker Image to GHCR - vision-service
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./backend/vision-service
          file: ./backend/vision-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/vision-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/vision-service:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/vision-service:${{ github.sha }}
          cache-from: type=gha,scope=vision-service

      # --- 4) Các Backend Node.js Microservices còn lại ---
      - name: Docker Build & Publish - user-service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: SERVICE_NAME=user-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/user-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/user-service:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/user-service:${{ github.sha }}
          cache-from: type=gha,scope=user-service
          cache-to: type=gha,mode=min,scope=user-service

      - name: Docker Build & Publish - alert-service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: SERVICE_NAME=alert-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/alert-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/alert-service:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/alert-service:${{ github.sha }}
          cache-from: type=gha,scope=alert-service
          cache-to: type=gha,mode=min,scope=alert-service

      - name: Docker Build & Publish - media-service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: SERVICE_NAME=media-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/media-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/media-service:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/media-service:${{ github.sha }}
          cache-from: type=gha,scope=media-service
          cache-to: type=gha,mode=min,scope=media-service

      - name: Docker Build & Publish - gis-service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: SERVICE_NAME=gis-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gis-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gis-service:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gis-service:${{ github.sha }}
          cache-from: type=gha,scope=gis-service
          cache-to: type=gha,mode=min,scope=gis-service

      - name: Docker Build & Publish - ai-service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: SERVICE_NAME=ai-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-service:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-service:${{ github.sha }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=min,scope=ai-service

      - name: Docker Build & Publish - notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: SERVICE_NAME=notification-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/notification-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/notification-service:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/notification-service:${{ github.sha }}
          cache-from: type=gha,scope=notification-service
          cache-to: type=gha,mode=min,scope=notification-service

      - name: Upload Trivy Image Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-image-reports
          path: trivy-image-*.txt
          if-no-files-found: ignore
          retention-days: 7

  # ===============================================================
  # 4. triển khai liên tục và nền tảng vận hành argocd cùng kubernetes
  #    Chỉ chạy khi push / manual trên main. Pull request sẽ bị skip
  #    (không cần approval nên vẫn merge được bình thường).
  # ===============================================================
  cd-deployment:
    name: 4. CD Deployment (Approval & Argo CD)
    needs: docker-build-and-publish
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    # kích hoạt tính năng phê duyệt môi trường triển khai thủ công trên github
    environment:
      name: production
      url: https://ecoalert.example.com

    steps:
      - name: Checkout Deployment Manifests
        uses: actions/checkout@v4

      - name: 4.1. GitOps Update & Push Kubernetes Manifest
        run: |
          for svc in api-gateway user-service alert-service media-service gis-service ai-service notification-service vision-service frontend; do
            NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${svc}:${{ github.sha }}"
            sed -i "s|image: .*${svc}:.*|image: ${NEW_IMAGE}|g" k8s/deployments.yaml
          done
          git diff k8s/deployments.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployments.yaml
          git commit -m "chore(gitops): update ecoalert images to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:refs/heads/gitops --force

      - name: 4.2. Argo CD Sync Verification
        run: |
          echo "=========================================================="
          echo " [GitOps] Pushed updated manifest to branch: gitops"
          echo "   Target Tag: ${{ github.sha }}"
          echo " [Argo CD] Automated reconciliation triggered from gitops!"
          echo "=========================================================="

  # ===============================================================
  # 5. gửi thông báo trạng thái quy trình qua telegram bot
  #    Chạy SAU khi CD kết thúc (success / failure / rejected / skipped)
  #    - Pull request: CD bị skip -> vẫn coi là thành công nếu CI/Security/Docker pass
  #    - Push main: CD phải success mới tính là thành công
  # ===============================================================
  notify:
    name: 5. Pipeline Notification (Telegram)
    needs:
      - ci-build-and-test
      - continuous-security
      - docker-build-and-publish
      - cd-deployment
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Pipeline Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
          CI_RESULT: ${{ needs.ci-build-and-test.result }}
          SEC_RESULT: ${{ needs.continuous-security.result }}
          DOCKER_RESULT: ${{ needs.docker-build-and-publish.result }}
          CD_RESULT: ${{ needs.cd-deployment.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets chua duoc cau hinh tren GitHub. Bo qua gui tin nhan."
            exit 0
          fi

          if [ "$CI_RESULT" == "success" ] && \
             [ "$SEC_RESULT" == "success" ] && \
             [ "$DOCKER_RESULT" == "success" ] && \
             { [ "$CD_RESULT" == "success" ] || [ "$CD_RESULT" == "skipped" ]; }; then
            STATUS_ICON="✅"
            STATUS_TEXT="THÀNH CÔNG (SUCCEEDED)"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="THẤT BẠI (FAILED)"
          fi

          case "$CD_RESULT" in
            success)   CD_TEXT="✅ Đã triển khai" ;;
            skipped)
              if [ "$EVENT_NAME" == "pull_request" ]; then
                CD_TEXT="⏭️ Bỏ qua (Pull Request)"
              else
                CD_TEXT="⏭️ Bỏ qua"
              fi ;;
            failure)   CD_TEXT="❌ Thất bại / bị từ chối phê duyệt" ;;
            cancelled) CD_TEXT="⚠️ Đã hủy" ;;
            *)         CD_TEXT="$CD_RESULT" ;;
          esac

          CLEAN_MSG=$(echo "$RAW_COMMIT_MSG" | head -n 1 | sed 's/[*_`\\]//g')
          FULL_SHA="${{ github.sha }}"
          SHORT_SHA="${FULL_SHA:0:7}"

          MESSAGE="🚀 *ECOALERT DEVSECOPS PIPELINE*
          $STATUS_ICON *Trạng thái:* $STATUS_TEXT
          🚢 *CD Deployment:* $CD_TEXT
          📦 *Repository:* \`${{ github.repository }}\`
          🌿 *Nhánh:* \`${{ github.ref_name }}\`
          👤 *Tác giả:* ${{ github.actor }}
          🔗 *Commit:* [$SHORT_SHA](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          📝 *Nội dung:* $CLEAN_MSG
          ⏰ *Thời gian:* $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview="true"
