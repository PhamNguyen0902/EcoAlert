name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===============================================================
  # 1. CI Automation (Build, Health Check, Unit Tests & Coverage)
  # ===============================================================
  ci-build-and-test:
    name: 1. CI Automation (Build, Health Check & Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/vision-service/requirements*.txt'

      - name: Install OpenCV System Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install All Dependencies
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix mobile ci --no-audit --no-fund
          (cd backend/shared && npm ci --no-audit --no-fund && npm run build)
          for svc in api-gateway user-service alert-service gis-service media-service notification-service ai-service; do
            echo "Installing dependencies for backend/$svc..."
            (cd "backend/$svc" && npm ci --no-audit --no-fund)
          done
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
          pip install -r backend/vision-service/requirements-dev.txt coverage

      - name: 1.1. Code Linting & Syntax Check
        run: |
          npm --prefix frontend run lint
          python -m compileall -q backend/vision-service/main.py backend/vision-service/routers backend/vision-service/schemas backend/vision-service/services

      - name: 1.2. Build All Projects (Backend Microservices & Frontend)
        run: |
          for svc in api-gateway user-service alert-service gis-service media-service notification-service ai-service; do
            echo "Building backend/$svc..."
            (cd "backend/$svc" && npm run build && node --check dist/server.js)
          done
          npm --prefix frontend run build

      - name: 1.3. Unit Testing & Code Coverage
        run: |
          mkdir -p coverage
          echo "=== Frontend Tests ==="
          (
            cd frontend
            npm run test:routing
            node --test --experimental-test-coverage \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=lcov --test-reporter-destination=../coverage/frontend-cjs.lcov \
              tests/*.test.cjs
          )
          [ -f coverage/frontend-cjs.lcov ] && sed -i 's|^SF:|SF:frontend/|' coverage/frontend-cjs.lcov

          for svc in ai-service alert-service gis-service media-service; do
            echo "=== Backend Tests: $svc ==="
            (
              cd "backend/$svc"
              node --test --experimental-test-coverage \
                --test-reporter=spec --test-reporter-destination=stdout \
                --test-reporter=lcov --test-reporter-destination="../../coverage/${svc}.lcov" \
                dist/tests/*.test.js
            )
            [ -f "coverage/${svc}.lcov" ] && sed -i "s|^SF:|SF:backend/${svc}/|" "coverage/${svc}.lcov"
          done

          echo "=== Backend Tests: notification-service ==="
          (
            cd backend/notification-service
            node --test --experimental-test-coverage \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=lcov --test-reporter-destination="../../coverage/notification-service.lcov" \
              tests/*.test.cjs
          )
          [ -f coverage/notification-service.lcov ] && sed -i 's|^SF:|SF:backend/notification-service/|' coverage/notification-service.lcov

          echo "=== Python Vision Service Tests ==="
          (
            cd backend/vision-service
            python -m coverage run --source=routers,schemas,services -m unittest discover -s tests -v
            python -m coverage report -m
            python -m coverage xml -o ../../coverage/vision-coverage.xml
          )

          echo "=== Mobile Contract & Unit Tests ==="
          (cd mobile && npm test)

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 7

  # ===============================================================
  # 2. Continuous Security (Gitleaks, Audit, Trivy & Sonar)
  # ===============================================================
  continuous-security:
    name: 2. Continuous Security (Gitleaks, Audit, Trivy & Sonar)
    needs: ci-build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Test Coverage Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: code-coverage-report
          path: coverage/

      - name: 2.1. Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 2.2. Dependency Vulnerability Audit
        run: |
          for dir in frontend mobile backend/shared backend/api-gateway backend/user-service backend/alert-service backend/gis-service backend/media-service backend/notification-service backend/ai-service; do
            echo "Scanning dependencies in $dir..."
            (cd "$dir" && npm audit --audit-level=high) || echo "::warning::npm audit detected vulnerabilities in $dir."
          done

      - name: 2.3. Trivy Filesystem & Dependency Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'table'
          output: 'trivy-fs-report.txt'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Display Trivy FS Scan Results
        if: always()
        run: |
          if [ -f trivy-fs-report.txt ]; then
            cat trivy-fs-report.txt
          fi

      - name: 2.4. SonarQube Code Quality Analysis
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        continue-on-error: true

      - name: 2.5. Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-reports
          path: trivy-fs-report.txt
          retention-days: 7

  # ===============================================================
  # 3. Artifact Management (Matrix 9 services: Build -> Scan -> Retag & Push)
  # ===============================================================
  docker-build-and-publish:
    name: 3. Artifact Management (${{ matrix.name }})
    needs: continuous-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: frontend,             context: ./frontend,               file: ./frontend/Dockerfile }
          - { name: vision-service,       context: ./backend/vision-service, file: ./backend/vision-service/Dockerfile }
          - { name: api-gateway,          context: ./backend, file: ./backend/Dockerfile, svc: api-gateway }
          - { name: user-service,         context: ./backend, file: ./backend/Dockerfile, svc: user-service }
          - { name: alert-service,        context: ./backend, file: ./backend/Dockerfile, svc: alert-service }
          - { name: media-service,        context: ./backend, file: ./backend/Dockerfile, svc: media-service }
          - { name: gis-service,          context: ./backend, file: ./backend/Dockerfile, svc: gis-service }
          - { name: ai-service,           context: ./backend, file: ./backend/Dockerfile, svc: ai-service }
          - { name: notification-service, context: ./backend, file: ./backend/Dockerfile, svc: notification-service }

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Prepare Image Metadata
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load for scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.svc && format('SERVICE_NAME={0}', matrix.svc) || '' }}
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          format: table
          output: trivy-image-${{ matrix.name }}.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Push (retag, no rebuild)
        if: github.event_name != 'pull_request'
        env:
          MAT_NAME: ${{ matrix.name }}
          FULL_SHA: ${{ github.sha }}
        run: |
          BASE="${REGISTRY}/${IMAGE_PREFIX}/${MAT_NAME}"
          for t in latest "${SHORT_SHA}" "${FULL_SHA}"; do
            docker tag "${BASE}:${FULL_SHA}" "${BASE}:${t}"
            docker push "${BASE}:${t}"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-${{ matrix.name }}
          path: trivy-image-${{ matrix.name }}.txt
          if-no-files-found: ignore
          retention-days: 7

  # ===============================================================
  # 4. CD Deployment (Approval & Argo CD GitOps)
  #    Chỉ chạy khi push / manual trên main. Pull request sẽ bị skip.
  # ===============================================================
  cd-deployment:
    name: 4. CD Deployment (Approval & Argo CD)
    needs: docker-build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    environment:
      name: production
      url: https://ecoalert.example.com

    steps:
      - name: Checkout Deployment Manifests
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 4.1. GitOps Update & Push Kubernetes Manifest
        env:
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          IMAGE_PREFIX=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')

          if git ls-remote --exit-code --heads origin gitops >/dev/null 2>&1; then
            git fetch origin gitops
            git checkout -B gitops FETCH_HEAD
            git checkout "${DEPLOY_SHA}" -- k8s/
          else
            git checkout -B gitops "${DEPLOY_SHA}"
          fi

          for svc in api-gateway user-service alert-service media-service gis-service ai-service notification-service vision-service frontend; do
            NEW_IMAGE="${REGISTRY}/${IMAGE_PREFIX}/${svc}:${DEPLOY_SHA}"
            sed -i "s|image: ${REGISTRY}/${IMAGE_PREFIX}/${svc}:.*|image: ${NEW_IMAGE}|g" k8s/deployments.yaml
          done

          git diff --cached k8s/deployments.yaml || git diff k8s/deployments.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git commit -m "chore(gitops): update ecoalert images to ${DEPLOY_SHA} [skip ci]" || echo "No changes to commit"
          git push origin gitops

  # ===============================================================
  # 5. Pipeline Notification (Telegram - 1 tin nhắn tổng kết toàn luồng)
  # ===============================================================
  notify:
    name: 5. Pipeline Notification (Telegram)
    needs:
      - ci-build-and-test
      - continuous-security
      - docker-build-and-publish
      - cd-deployment
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Telegram Pipeline Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
          CI_RESULT: ${{ needs.ci-build-and-test.result }}
          SEC_RESULT: ${{ needs.continuous-security.result }}
          DOCKER_RESULT: ${{ needs.docker-build-and-publish.result }}
          CD_RESULT: ${{ needs.cd-deployment.result }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets chua duoc cau hinh. Bo qua gui tin nhan."
            exit 0
          fi

          if [ "$CI_RESULT" = "success" ] && \
             [ "$SEC_RESULT" = "success" ] && \
             [ "$DOCKER_RESULT" = "success" ] && \
             { [ "$CD_RESULT" = "success" ] || [ "$CD_RESULT" = "skipped" ]; }; then
            STATUS_ICON="✅"
            STATUS_TEXT="THÀNH CÔNG (SUCCEEDED)"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="THẤT BẠI (FAILED)"
          fi

          case "$CD_RESULT" in
            success)   CD_TEXT="✅ Đã triển khai" ;;
            skipped)
              if [ "$EVENT_NAME" = "pull_request" ]; then
                CD_TEXT="⏭️ Bỏ qua (Pull Request)"
              else
                CD_TEXT="⏭️ Bỏ qua"
              fi ;;
            failure)   CD_TEXT="❌ Thất bại / bị từ chối phê duyệt" ;;
            cancelled) CD_TEXT="⚠️ Đã hủy" ;;
            *)         CD_TEXT="$CD_RESULT" ;;
          esac

          CLEAN_MSG=$(echo "$RAW_COMMIT_MSG" | head -n 1 | sed 's/[*_`\\]//g')
          SHORT_SHA="${SHA:0:7}"

          MESSAGE="🚀 *ECOALERT DEVSECOPS PIPELINE*
          ${STATUS_ICON} *Trạng thái:* ${STATUS_TEXT}
          🚢 *CD Deployment:* ${CD_TEXT}
          📦 *Repository:* \`${REPO}\`
          🌿 *Nhánh:* \`${REF_NAME}\`
          👤 *Tác giả:* ${ACTOR}
          🔗 *Commit:* [${SHORT_SHA}](${SERVER_URL}/${REPO}/commit/${SHA})
          📝 *Nội dung:* ${CLEAN_MSG}
          ⏰ *Thời gian:* $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "disable_web_page_preview=true"
