name: CD - Deploy (Argo CD)

on:
  workflow_run:
    workflows: ["CI - DevSecOps"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA cần deploy / rollback"
        required: true

permissions:
  contents: write

env:
  REGISTRY: ghcr.io
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: CD Deployment (Approval & Argo CD)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    environment:
      name: production
      url: https://ecoalert.example.com

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # (#5, #9, #10, #19) Neo đầy đủ đường dẫn sed và giữ lịch sử commit trên nhánh gitops
      - name: GitOps update manifest
        env:
          REPO: ${{ github.repository }}
        run: |
          IMAGE_PREFIX=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')

          # Nếu nhánh gitops đã tồn tại trên remote, kế thừa lịch sử của nó thay vì force push
          if git ls-remote --exit-code --heads origin gitops >/dev/null 2>&1; then
            git fetch origin gitops
            git checkout -B gitops FETCH_HEAD
            git checkout "${DEPLOY_SHA}" -- k8s/
          else
            git checkout -B gitops "${DEPLOY_SHA}"
          fi

          for svc in api-gateway user-service alert-service media-service gis-service ai-service notification-service vision-service frontend; do
            NEW_IMAGE="${REGISTRY}/${IMAGE_PREFIX}/${svc}:${DEPLOY_SHA}"
            sed -i "s|image: ${REGISTRY}/${IMAGE_PREFIX}/${svc}:.*|image: ${NEW_IMAGE}|g" k8s/deployments.yaml
          done

          git diff --cached k8s/deployments.yaml || git diff k8s/deployments.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git commit -m "chore(gitops): update ecoalert images to ${DEPLOY_SHA} [skip ci]" || echo "No changes to commit"
          git push origin gitops

  notify:
    name: CD Notification (Telegram)
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT: ${{ needs.deploy.result }}
          SHA: ${{ env.DEPLOY_SHA }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets chua duoc cau hinh. Bo qua gui tin nhan."
            exit 0
          fi
          if [ "$RESULT" = "success" ]; then
            ICON="✅"
            TXT="DEPLOY THÀNH CÔNG"
          else
            ICON="❌"
            TXT="DEPLOY THẤT BẠI"
          fi
          MESSAGE="🚢 ECOALERT CD (Argo CD GitOps)
          ${ICON} ${TXT}
          📦 ${REPO}
          🔗 Commit: ${SHA:0:7}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
