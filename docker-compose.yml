services:
  mongodb:
    image: mongo:6.0
    container_name: ecoalert_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ecoalert_network

  redis:
    image: redis:7.0-alpine
    container_name: ecoalert_redis
    ports:
      - "6379:6379"
    networks:
      - ecoalert_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ecoalert_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ecoalert_network

  api-gateway:
    build:
      context: ./backend
      args:
        SERVICE_NAME: api-gateway
    container_name: ecoalert_api_gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=${REDIS_URL}
      - USER_SERVICE_URL=http://user-service:3001
      - ALERT_SERVICE_URL=http://alert-service:3002
      - MEDIA_SERVICE_URL=http://media-service:3003
      - GIS_SERVICE_URL=http://gis-service:3004
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - AI_SERVICE_URL=http://ai-service:3005
      - INTERNAL_GATEWAY_SHARED_SECRET=${INTERNAL_GATEWAY_SHARED_SECRET}
    depends_on:
      - user-service
      - alert-service
      - media-service
      - gis-service
      - ai-service
      - notification-service
    networks:
      - ecoalert_network

  user-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: user-service
    container_name: ecoalert_user_service
    environment:
      - PORT=3001
      - MONGO_URI=${MONGO_URI_USER}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
      - redis
    networks:
      - ecoalert_network

  alert-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: alert-service
    container_name: ecoalert_alert_service
    environment:
      - PORT=3002
      - MONGO_URI=${MONGO_URI_ALERT}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - USER_SERVICE_URL=http://user-service:3001
    depends_on:
      - mongodb
      - rabbitmq
      - user-service
    networks:
      - ecoalert_network

  media-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: media-service
    container_name: ecoalert_media_service
    environment:
      - PORT=3003
      - MONGO_URI=${MONGO_URI_MEDIA}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - INTERNAL_GATEWAY_SHARED_SECRET=${INTERNAL_GATEWAY_SHARED_SECRET}
    depends_on:
      - mongodb
    networks:
      - ecoalert_network

  gis-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: gis-service
    container_name: ecoalert_gis_service
    env_file:
      - ./backend/gis-service/.env
    environment:
      - PORT=3004
      - MONGO_URI=${MONGO_URI_GIS}
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - ecoalert_network

  ai-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: ai-service
    container_name: ecoalert_ai_service
    env_file:
      - ./backend/ai-service/.env
    environment:
      - PORT=3005
      - RABBITMQ_URL=${RABBITMQ_URL}
      - MONGO_URI=${MONGO_URI_AI}
      - ALERT_MONGO_URI=${MONGO_URI_ALERT}
      - REDIS_URL=${REDIS_URL}
      # OpenRouter credentials and task-specific models come only from env_file.
      # This prevents blank root Compose variables from overriding valid service values.
      - ASSISTANT_RATE_LIMIT=${ASSISTANT_RATE_LIMIT}
      - ASSISTANT_RATE_WINDOW_SECONDS=${ASSISTANT_RATE_WINDOW_SECONDS}
      - INTERNAL_GATEWAY_SHARED_SECRET=${INTERNAL_GATEWAY_SHARED_SECRET}
      - VISION_AI_ENABLED=${VISION_AI_ENABLED:-false}
      - VISION_SEGMENTATION_ENABLED=${VISION_SEGMENTATION_ENABLED:-false}
      - VISION_SERVICE_URL=http://vision-service:3007
      - VISION_TIMEOUT_MS=${VISION_TIMEOUT_MS:-45000}
      - MEDIA_SERVICE_URL=http://media-service:3003
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - media-service
      - vision-service
    networks:
      - ecoalert_network

  vision-service:
    build:
      context: ./backend/vision-service
      target: runtime
      args:
        TORCH_INDEX_URL: ${VISION_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: ecoalert_vision_service
    expose:
      - "3007"
    environment:
      - VISION_INTERNAL_TOKEN=${INTERNAL_GATEWAY_SHARED_SECRET}
      - VISION_ALLOWED_IMAGE_HOSTS=${AWS_S3_BUCKET_NAME}.s3.${AWS_REGION}.amazonaws.com
      - VISION_ALLOW_PRIVATE_HOSTS=false
      - VISION_MAX_IMAGE_BYTES=10485760
      - VISION_MAX_IMAGE_PIXELS=25000000
      - VISION_MAX_INFERENCE_SIDE=1280
      - VISION_REQUEST_TIMEOUT_SECONDS=12
      - VISION_MAX_CONCURRENCY=${VISION_MAX_CONCURRENCY:-1}
      - VISION_DETECTION_MODEL_PATH=/models/ecoalert-waste-yolo26n-v1.pt
      - VISION_CONFIDENCE_THRESHOLD=${VISION_CONFIDENCE_THRESHOLD:-0.40}
      # No-build compatibility for the currently deployed Phase 1A image.
      - VISION_DETECTION_CONFIDENCE=${VISION_CONFIDENCE_THRESHOLD:-0.40}
      - VISION_IOU_THRESHOLD=${VISION_IOU_THRESHOLD:-0.45}
      - VISION_MAX_DETECTIONS=${VISION_MAX_DETECTIONS:-100}
      - VISION_DEVICE=${VISION_DEVICE:-auto}
      - VISION_SEGMENTATION_ENABLED=${VISION_SEGMENTATION_ENABLED:-false}
      - VISION_SAM2_CHECKPOINT_PATH=/models/sam2.1_hiera_tiny.pt
      - VISION_SAM2_CONFIG=configs/sam2.1/sam2.1_hiera_t.yaml
      - VISION_MODEL_EAGER_LOAD=${VISION_MODEL_EAGER_LOAD:-false}
      - VISION_SERVICE_PORT=3007
    volumes:
      - vision_model_cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3007/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ecoalert_network

  notification-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: notification-service
    container_name: ecoalert_notification_service
    environment:
      - PORT=3006
      - MONGO_URI=${MONGO_URI_NOTIFICATION}
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - ecoalert_network

networks:
  ecoalert_network:
    driver: bridge

volumes:
  mongo_data:
  vision_model_cache:
