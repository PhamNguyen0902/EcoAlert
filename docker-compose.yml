services:
  mongodb:
    image: mongo:6.0
    container_name: ecoalert_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  redis:
    image: redis:7.0-alpine
    container_name: ecoalert_redis
    # Redis is consumed only by EcoAlert containers. Keeping it internal avoids
    # colliding with another local stack that already owns host port 6379.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ecoalert_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  api-gateway:
    build:
      context: ./backend
      args:
        SERVICE_NAME: api-gateway
    container_name: ecoalert_api_gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=${REDIS_URL}
      - USER_SERVICE_URL=http://user-service:3001
      - ALERT_SERVICE_URL=http://alert-service:3002
      - GIS_SERVICE_URL=http://gis-service:3004
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - AI_SERVICE_URL=http://ai-service:3005
      - MEDIA_SERVICE_URL=http://media-service:3003
    depends_on:
      user-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      gis-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  user-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: user-service
    container_name: ecoalert_user_service
    environment:
      - PORT=3001
      # Compose is a self-contained local stack. Do not use the Atlas URI from
      # the root .env; it makes local containers fail whenever Atlas is offline.
      - MONGO_URI=mongodb://mongodb:27017/ecoalert-user-db
      - SERVICE_AUTH_SECRET=${SERVICE_AUTH_SECRET:-${JWT_SECRET}}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./backend/user-service/dist:/app/user-service/dist:ro
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  alert-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: alert-service
    container_name: ecoalert_alert_service
    environment:
      - PORT=3002
      - MONGO_URI=mongodb://mongodb:27017/ecoalert-alert-db
      - JWT_SECRET=${JWT_SECRET}
      - SERVICE_AUTH_SECRET=${SERVICE_AUTH_SECRET:-${JWT_SECRET}}
      - GIS_SERVICE_URL=http://gis-service:3004
      - AUTO_ASSIGN_ENABLED=${AUTO_ASSIGN_ENABLED:-true}
      - AUTO_ASSIGN_REQUIRE_ACTIVE_SHIFT=${AUTO_ASSIGN_REQUIRE_ACTIVE_SHIFT:-true}
      - AUTO_ASSIGN_MAX_ACTIVE_TASKS=${AUTO_ASSIGN_MAX_ACTIVE_TASKS:-5}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - USER_SERVICE_URL=http://user-service:3001
      - OFFICER_CHECKIN_RADIUS_METERS=${OFFICER_CHECKIN_RADIUS_METERS:-100}
      - OFFICER_EVIDENCE_RADIUS_METERS=${OFFICER_EVIDENCE_RADIUS_METERS:-${OFFICER_CHECKIN_RADIUS_METERS:-100}}
      - OFFICER_CHECKIN_MAX_ACCURACY_METERS=${OFFICER_CHECKIN_MAX_ACCURACY_METERS:-50}
      - OFFICER_MAX_GPS_ACCURACY_METERS=${OFFICER_MAX_GPS_ACCURACY_METERS:-100}
      - OFFICER_WORKLOAD_MODERATE_THRESHOLD=${OFFICER_WORKLOAD_MODERATE_THRESHOLD:-3}
      - OFFICER_WORKLOAD_HIGH_THRESHOLD=${OFFICER_WORKLOAD_HIGH_THRESHOLD:-5}
    volumes:
      # Keep the strict Phase 1A event contract synchronized without rebuilding
      # the Node image on this constrained local machine.
      - ./backend/alert-service/dist:/app/alert-service/dist:ro
      - ./backend/shared/dist:/app/shared/dist:ro
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  media-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: media-service
    container_name: ecoalert_media_service
    environment:
      - PORT=3003
      - MONGO_URI=mongodb://mongodb:27017/ecoalert-media-db
      - SERVICE_AUTH_SECRET=${SERVICE_AUTH_SECRET:-${JWT_SECRET}}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - VISION_SERVICE_URL=${VISION_SERVICE_URL:-http://vision-service:8001}
    volumes:
      - ./backend/media-service/dist:/app/media-service/dist:ro
      - ./backend/shared/dist:/app/shared/dist:ro
    depends_on:
      mongodb:
        condition: service_healthy
      vision-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3003/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  vision-service:
    build:
      context: ./backend/vision-service
    container_name: ecoalert_vision_service
    ports:
      - "8001:8001"
    environment:
      - YOLO_MODELS_CONFIG=config/models.json
      - YOLO_CONFIDENCE=${YOLO_CONFIDENCE:-0.25}
      - YOLO_IMAGE_SIZE=${YOLO_IMAGE_SIZE:-640}
      - YOLO_DEVICE=${YOLO_DEVICE:-auto}
      - YOLO_MAX_UPLOAD_MB=${YOLO_MAX_UPLOAD_MB:-10}
      - YOLO_MERGE_IOU=${YOLO_MERGE_IOU:-0.6}
      - YOLO_INFERENCE_TIMEOUT_SECONDS=${YOLO_INFERENCE_TIMEOUT_SECONDS:-8}
    volumes:
      - ./backend/vision-service/models:/app/models:ro
      - ./backend/vision-service/config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; h=json.load(urllib.request.urlopen('http://localhost:8001/health', timeout=3)); assert h['model_loaded']"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ecoalert_network

  # Explicit setup only: scripts/osrm/prepare-hcm.ps1. Never runs on normal up.
  osrm-tools:
    build:
      context: ./scripts/osrm
      dockerfile: Dockerfile.tools
    image: ecoalert-osmium-tools:1
    profiles: ["routing-tools"]
    volumes:
      - ${OSRM_SOURCE_DIR:-./data/osrm}:/source:ro
      - ${OSRM_DATA_DIR:-./data/osrm/hcm}:/data
      - ./scripts/osrm:/scripts:ro
    network_mode: none
    mem_limit: ${OSMIUM_MEMORY:-4g}
    cpus: 2.0

  osrm-prepare:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v5.27.1}
    profiles: ["routing-tools"]
    entrypoint: ["sh", "/scripts/prepare.sh"]
    environment:
      - OSRM_IMAGE=${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v5.27.1}
      - OSRM_THREADS=${OSRM_THREADS:-2}
    volumes:
      - ${OSRM_DATA_DIR:-./data/osrm/hcm}:/data
      - ./scripts/osrm:/scripts:ro
    network_mode: none
    mem_limit: ${OSRM_PREPARE_MEMORY:-3g}
    cpus: 2.0

  osrm:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v5.27.1}
    container_name: ecoalert_osrm
    entrypoint: ["sh", "/scripts/serve.sh"]
    environment:
      - OSRM_IMAGE=${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v5.27.1}
      - OSRM_THREADS=${OSRM_THREADS:-2}
    volumes:
      - ${OSRM_DATA_DIR:-./data/osrm/hcm}:/data:ro
      - ./scripts/osrm:/scripts:ro
    # Internal only: never publish the unauthenticated OSRM HTTP API to the LAN.
    expose: ["5000"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "bash", "/scripts/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - ecoalert_network

  gis-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: gis-service
    container_name: ecoalert_gis_service
    env_file:
      - ./backend/gis-service/.env
    environment:
      - PORT=3004
      - MONGO_URI=mongodb://mongodb:27017/ecoalert-gis-db
      - JWT_SECRET=${JWT_SECRET}
      - SERVICE_AUTH_SECRET=${SERVICE_AUTH_SECRET:-${JWT_SECRET}}
      - USER_SERVICE_URL=http://user-service:3001
      - RABBITMQ_URL=${RABBITMQ_URL}
      - OSRM_BASE_URL=${OSRM_BASE_URL:-http://osrm:5000}
      - OSRM_TIMEOUT_MS=${OSRM_TIMEOUT_MS:-10000}
      - OSRM_ROUTING_PROFILE=${OSRM_ROUTING_PROFILE:-driving}
      - OSRM_DATA_ROOT=/osrm-data
    depends_on:
      osrm:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      # Run the locally type-checked GIS read model without rebuilding the
      # shared Node image on this constrained workstation.
      - ./backend/gis-service/dist:/app/gis-service/dist:ro
      - ${OSRM_DATA_DIR:-./data/osrm/hcm}:/osrm-data:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3004/health/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  ai-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: ai-service
    container_name: ecoalert_ai_service
    env_file:
      - ./backend/ai-service/.env
    environment:
      - PORT=3005
      - MONGO_URI=mongodb://mongodb:27017/ecoalert-ai-db
      # ai-service mở thêm 1 kết nối Mongo thứ 2 (chỉ đọc) để lấy dữ liệu alert
      # phục vụ tính năng AI assistant/RAG. Nếu thiếu biến này, code sẽ tự fallback
      # về localhost:27017 -> connect thất bại trong container.
      - ALERT_MONGO_URI=mongodb://mongodb:27017/ecoalert-alert-db
      - RABBITMQ_URL=${RABBITMQ_URL}
      # The API key lives only in backend/ai-service/.env.  Do not let a stale
      # root-level migration copy override the service-specific credential.
      - OPENROUTER_ANALYSIS_MODEL=${OPENROUTER_ANALYSIS_MODEL:-openai/gpt-4o-mini}
      - AI_IMAGE_VALIDATION_HIGH_THRESHOLD=${AI_IMAGE_VALIDATION_HIGH_THRESHOLD:-0.80}
      - AI_IMAGE_VALIDATION_LOW_THRESHOLD=${AI_IMAGE_VALIDATION_LOW_THRESHOLD:-0.50}
      - AI_CATEGORY_SUGGESTION_THRESHOLD=${AI_CATEGORY_SUGGESTION_THRESHOLD:-0.80}
      - AI_CATEGORY_UNCLASSIFIED_THRESHOLD=${AI_CATEGORY_UNCLASSIFIED_THRESHOLD:-0.50}
    volumes:
      # Resource-safe local Phase 1A deployment: use the locally type-checked
      # service output without rebuilding the Node image.
      - ./backend/ai-service/dist:/app/ai-service/dist:ro
      - ./backend/shared/dist:/app/shared/dist:ro
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3005/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  notification-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: notification-service
    container_name: ecoalert_notification_service
    environment:
      - PORT=3006
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_URI=mongodb://mongodb:27017/ecoalert-notification-db
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3006/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

networks:
  ecoalert_network:
    driver: bridge

volumes:
  mongo_data:
