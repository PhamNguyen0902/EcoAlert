services:
  mongodb:
    image: mongo:6.0
    container_name: ecoalert_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  redis:
    image: redis:7.0-alpine
    container_name: ecoalert_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ecoalert_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  api-gateway:
    build:
      context: ./backend
      args:
        SERVICE_NAME: api-gateway
    container_name: ecoalert_api_gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=${REDIS_URL}
      - USER_SERVICE_URL=http://user-service:3001
      - ALERT_SERVICE_URL=http://alert-service:3002
      - GIS_SERVICE_URL=http://gis-service:3004
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - AI_SERVICE_URL=http://ai-service:3005
      - MEDIA_SERVICE_URL=http://media-service:3003
    depends_on:
      user-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      gis-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  user-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: user-service
    container_name: ecoalert_user_service
    environment:
      - PORT=3001
      # Compose is a self-contained local stack. Do not use the Atlas URI from
      # the root .env; it makes local containers fail whenever Atlas is offline.
      - MONGO_URI=mongodb://mongodb:27017/ecoalert-user-db
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./backend/user-service/dist:/app/user-service/dist:ro
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  alert-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: alert-service
    container_name: ecoalert_alert_service
    environment:
      - PORT=3002
      - MONGO_URI=mongodb://mongodb:27017/ecoalert-alert-db
      - RABBITMQ_URL=${RABBITMQ_URL}
      - USER_SERVICE_URL=http://user-service:3001
      - OFFICER_CHECKIN_RADIUS_METERS=${OFFICER_CHECKIN_RADIUS_METERS:-50}
      - OFFICER_EVIDENCE_RADIUS_METERS=${OFFICER_EVIDENCE_RADIUS_METERS:-50}
      - OFFICER_MAX_GPS_ACCURACY_METERS=${OFFICER_MAX_GPS_ACCURACY_METERS:-100}
      - OFFICER_WORKLOAD_MODERATE_THRESHOLD=${OFFICER_WORKLOAD_MODERATE_THRESHOLD:-3}
      - OFFICER_WORKLOAD_HIGH_THRESHOLD=${OFFICER_WORKLOAD_HIGH_THRESHOLD:-5}
    volumes:
      # Keep the strict Phase 1A event contract synchronized without rebuilding
      # the Node image on this constrained local machine.
      - ./backend/alert-service/dist:/app/alert-service/dist:ro
      - ./backend/shared/dist:/app/shared/dist:ro
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  media-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: media-service
    container_name: ecoalert_media_service
    environment:
      - PORT=3003
      - MONGO_URI=mongodb://mongodb:27017/ecoalert-media-db
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3003/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  gis-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: gis-service
    container_name: ecoalert_gis_service
    env_file:
      - ./backend/gis-service/.env
    environment:
      - PORT=3004
      - MONGO_URI=mongodb://mongodb:27017/ecoalert-gis-db
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      # Run the locally type-checked GIS read model without rebuilding the
      # shared Node image on this constrained workstation.
      - ./backend/gis-service/dist:/app/gis-service/dist:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3004/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  ai-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: ai-service
    container_name: ecoalert_ai_service
    env_file:
      - ./backend/ai-service/.env
    environment:
      - PORT=3005
      - MONGO_URI=mongodb://mongodb:27017/ecoalert-ai-db
      # ai-service mở thêm 1 kết nối Mongo thứ 2 (chỉ đọc) để lấy dữ liệu alert
      # phục vụ tính năng AI assistant/RAG. Nếu thiếu biến này, code sẽ tự fallback
      # về localhost:27017 -> connect thất bại trong container.
      - ALERT_MONGO_URI=mongodb://mongodb:27017/ecoalert-alert-db
      - RABBITMQ_URL=${RABBITMQ_URL}
      # The API key lives only in backend/ai-service/.env.  Do not let a stale
      # root-level migration copy override the service-specific credential.
      - OPENROUTER_ANALYSIS_MODEL=${OPENROUTER_ANALYSIS_MODEL:-openai/gpt-4o-mini}
      - AI_IMAGE_VALIDATION_HIGH_THRESHOLD=${AI_IMAGE_VALIDATION_HIGH_THRESHOLD:-0.80}
      - AI_IMAGE_VALIDATION_LOW_THRESHOLD=${AI_IMAGE_VALIDATION_LOW_THRESHOLD:-0.50}
      - AI_CATEGORY_SUGGESTION_THRESHOLD=${AI_CATEGORY_SUGGESTION_THRESHOLD:-0.80}
      - AI_CATEGORY_UNCLASSIFIED_THRESHOLD=${AI_CATEGORY_UNCLASSIFIED_THRESHOLD:-0.50}
    volumes:
      # Resource-safe local Phase 1A deployment: use the locally type-checked
      # service output without rebuilding the Node image.
      - ./backend/ai-service/dist:/app/ai-service/dist:ro
      - ./backend/shared/dist:/app/shared/dist:ro
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3005/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

  notification-service:
    build:
      context: ./backend
      args:
        SERVICE_NAME: notification-service
    container_name: ecoalert_notification_service
    environment:
      - PORT=3006
      - MONGO_URI=mongodb://mongodb:27017/ecoalert-notification-db
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3006/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ecoalert_network

networks:
  ecoalert_network:
    driver: bridge

volumes:
  mongo_data:
