# triển khai toàn bộ hệ thống microservices và giao diện web của EcoAlert trên Kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/phamnguyen0902/ecoalert/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: '3000'
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecoalert-secrets
                  key: JWT_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ecoalert-secrets
                  key: REDIS_URL
            - name: USER_SERVICE_URL
              value: 'http://user-service:3001'
            - name: ALERT_SERVICE_URL
              value: 'http://alert-service:3002'
            - name: MEDIA_SERVICE_URL
              value: 'http://media-service:3003'
            - name: GIS_SERVICE_URL
              value: 'http://gis-service:3004'
            - name: AI_SERVICE_URL
              value: 'http://ai-service:3005'
            - name: NOTIFICATION_SERVICE_URL
              value: 'http://notification-service:3006'
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '384Mi'
              cpu: '500m'
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: ghcr.io/phamnguyen0902/ecoalert/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: '3001'
            - name: MONGO_URI
              value: 'mongodb://mongodb:27017/ecoalert-user-db'
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecoalert-secrets
                  key: JWT_SECRET
            - name: SERVICE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecoalert-secrets
                  key: SERVICE_AUTH_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ecoalert-secrets
                  key: REDIS_URL
            - name: COGNITO_REGION
              valueFrom:
                secretKeyRef:
                  name: ecoalert-secrets
                  key: COGNITO_REGION
            - name: COGNITO_USER_POOL_ID
              valueFrom:
                secretKeyRef:
                  name: ecoalert-secrets
                  key: COGNITO_USER_POOL_ID
            - name: COGNITO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ecoalert-secrets
                  key: COGNITO_CLIENT_ID
            - name: COGNITO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecoalert-secrets
                  key: COGNITO_CLIENT_SECRET
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '384Mi'
              cpu: '500m'
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
