apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-service
  labels:
    app: vision-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vision-service
  template:
    metadata:
      labels:
        app: vision-service
    spec:
      containers:
        - name: vision-service
          image: ghcr.io/phamnguyen0902/ecoalert/vision-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: YOLO_DEVICE
              value: 'cpu'
            - name: YOLO_MODELS_CONFIG
              value: 'config/models.json'
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: ecoalert-secrets
                  key: AWS_REGION
            - name: AWS_S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: ecoalert-secrets
                  key: AWS_S3_BUCKET_NAME
          resources:
            requests:
              memory: '512Mi'
              cpu: '250m'
            limits:
              memory: '1536Mi'
              cpu: '1000m'
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
