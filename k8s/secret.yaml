# cấu hình lưu trữ các biến môi trường nhạy cảm cho hệ thống EcoAlert trên Kubernetes
apiVersion: v1
kind: Secret
metadata:
  name: ecoalert-secrets
type: Opaque
stringData:
  JWT_SECRET: 'ecoalert-change-me-jwt-secret-32-chars'
  SERVICE_AUTH_SECRET: 'ecoalert-change-me-service-secret-32-chars'
  RABBITMQ_URL: 'amqp://guest:guest@rabbitmq:5672'
  REDIS_URL: 'redis://redis:6379'
  OPENROUTER_API_KEY: 'change-me-openrouter-key'
  AWS_REGION: 'ap-southeast-1'
  AWS_ACCESS_KEY_ID: 'change-me-aws-key'
  AWS_SECRET_ACCESS_KEY: 'change-me-aws-secret'
  AWS_S3_BUCKET_NAME: 'ecoalert-media'
  COGNITO_REGION: 'ap-southeast-1'
  COGNITO_USER_POOL_ID: 'change-me-pool-id'
  COGNITO_CLIENT_ID: 'change-me-client-id'
  COGNITO_CLIENT_SECRET: 'change-me-client-secret'
